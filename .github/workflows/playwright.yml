name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same branch when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false # one failing browser should not hide the other result
      matrix:
        project: [chromium, firefox] # each browser runs as its own parallel job

    env:
      # Non-sensitive config lives in repository Variables; falls back to production.
      BASE_URL: ${{ vars.BASE_URL || 'https://coffee-cart.app' }}
      # Sensitive values (if tests ever need logins) go in repository Secrets:
      # TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks (types and no hard-coded waits)
        run: npm run verify

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.project }}
          path: reports/junit.xml
          retention-days: 14
          if-no-files-found: ignore
